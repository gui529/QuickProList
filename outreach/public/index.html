<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuickProList Outreach</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <div class="max-w-4xl mx-auto px-4 py-8">
    <header class="mb-8">
      <h1 class="text-2xl font-bold tracking-tight">Discovery worker</h1>
      <p class="text-sm text-slate-600 mt-1">
        Finds pros and pushes to <code class="text-xs bg-slate-200 px-1 rounded">campaign_prospects</code> on the live API.
        <strong>Approve and send only in the app:</strong> Admin → Campaigns → Queue (not on this page).
      </p>
      <p id="meta-line" class="text-xs text-slate-500 mt-2"></p>
    </header>

    <section class="bg-white rounded-2xl ring-1 ring-slate-200 p-5 mb-6">
      <h2 class="font-semibold mb-3">Find pros (Cursor agent + web search)</h2>
      <div class="flex flex-wrap gap-3 items-end">
        <div class="flex flex-col gap-1">
          <label class="text-xs font-semibold text-slate-600 uppercase">Town</label>
          <select id="city" class="rounded-xl ring-1 ring-slate-200 px-3 py-2 text-sm min-w-[180px]"></select>
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-xs font-semibold text-slate-600 uppercase">Trade</label>
          <select id="category" class="rounded-xl ring-1 ring-slate-200 px-3 py-2 text-sm min-w-[160px]"></select>
        </div>
        <button id="find-btn" type="button" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-sm font-semibold hover:bg-slate-800 disabled:opacity-50">
          Find pros
        </button>
      </div>
      <p id="find-preview" class="text-xs text-slate-500 mt-3 font-mono break-all"></p>
      <p id="find-status" class="text-sm mt-2 text-slate-600 whitespace-pre-wrap"></p>
    </section>

    <p id="error" class="hidden text-sm text-rose-700 bg-rose-50 ring-1 ring-rose-200 rounded-xl px-4 py-2 mb-3"></p>
    <ul id="last-pushed" class="flex flex-col gap-3"></ul>
  </div>

  <script>
    const $ = (id) => document.getElementById(id)

    function showError(msg) {
      const el = $('error')
      if (!msg) { el.classList.add('hidden'); el.textContent = ''; return }
      el.textContent = msg
      el.classList.remove('hidden')
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        headers: { 'Content-Type': 'application/json' },
        ...opts,
      })
      const data = await res.json().catch(() => ({}))
      if (!res.ok) throw new Error(data.error || res.statusText)
      return data
    }

    async function loadMeta() {
      const meta = await api('/api/meta')
      $('city').innerHTML = meta.towns.map((t) => `<option value="${t}">${t}</option>`).join('')
      $('category').innerHTML = meta.categories.map((c) => `<option value="${c.value}">${c.label}</option>`).join('')
      $('meta-line').textContent = `API target: ${meta.apiBaseUrl} · discovery: ${meta.discoveryProvider}`
      $('city').addEventListener('change', updateFindPreview)
      $('category').addEventListener('change', updateFindPreview)
      await updateFindPreview()
    }

    async function updateFindPreview() {
      const city = $('city').value
      const category = $('category').value
      if (!city) return
      const { command } = await api(`/api/discover-preview?city=${encodeURIComponent(city)}&category=${encodeURIComponent(category)}`)
      $('find-preview').textContent = `Will run: ${command}`
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    function renderLastPushed(prospects) {
      const list = $('last-pushed')
      if (!prospects?.length) {
        list.innerHTML = ''
        return
      }
      list.innerHTML = `
        <h2 class="font-semibold text-sm text-slate-700">Just pushed to API (${prospects.length})</h2>
        ${prospects.map((p) => `
          <li class="bg-white rounded-2xl ring-1 ring-slate-200 p-4">
            <span class="font-semibold">${escapeHtml(p.businessName)}</span>
            <p class="text-sm text-slate-600">${escapeHtml(p.email)}</p>
            <p class="text-xs text-slate-500">${escapeHtml(p.city)} · ${escapeHtml(p.category)} · ${escapeHtml(p.status || 'pending_review')}</p>
          </li>
        `).join('')}
      `
    }

    $('find-btn').addEventListener('click', async () => {
      showError('')
      const btn = $('find-btn')
      btn.disabled = true
      const preview = $('find-preview').textContent.replace(/^Will run:\s*/, '')
      $('find-status').textContent = `Running ${preview}… (often 1–3 min)`
      $('last-pushed').innerHTML = ''
      try {
        const data = await api('/api/discover', {
          method: 'POST',
          body: JSON.stringify({ city: $('city').value, category: $('category').value }),
        })
        let status = `Query: ${data.query} — found ${data.found}, added ${data.added}, skipped ${data.skipped}\n\nOpen Admin → Campaigns → Queue on ${(await api('/api/meta')).apiBaseUrl} to approve.`
        if (data.warning) status += `\n\n${data.warning}`
        $('find-status').textContent = status
        if (data.warning) showError(data.warning)
        renderLastPushed(data.prospects)
      } catch (e) {
        showError(e.message)
        $('find-status').textContent = ''
      }
      btn.disabled = false
    })

    loadMeta().catch((e) => showError(e.message))
  </script>
</body>
</html>
